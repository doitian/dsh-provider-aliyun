# Copy this fragment into the `providers` mapping of the `llm-pi-ai` entry in
# your own $DSH_HOME/profiles/<profile>/cordis.patch.yml, then keep every
# provider you already had. Use it when your profile already sets
# `llm-pi-ai.config` — see "If you already configure llm-pi-ai" in the README.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # ... your existing routes, e.g. opencode-go ...
      aliyun:
        displayName: Aliyun DashScope
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        apiKeyEnv: ALIYUN_API_KEY
        compat:
          thinkingFormat: qwen
          supportsReasoningEffort: false
          supportsDeveloperRole: false
          supportsStore: false
          supportsStrictMode: true
        models:
          - id: qwen3.8-max
            name: Qwen3.8 Max
            contextWindow: 1000000
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
