# Aliyun DashScope (Bailian) provider bundle for DeepSeek Harness.
#
# This bundle inserts its own plugin entry. The endpoint, the credential
# reference, and the Qwen model catalog are all defaults inside the package, so
# nothing about the models belongs in a profile — the catalog moves forward with
# `pnpm update`, and no profile patch can shadow it.
#
# Configure it on the Models page, or by adding fields under this entry's
# `config` (displayName, apiKeyEnv, baseURL, models, reasoning, headers).
- insert:
    - id: llm-aliyun
      name: '@doitian/dsh-provider-aliyun'
